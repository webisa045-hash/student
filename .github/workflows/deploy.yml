name: Deploy React App to RackGenius VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare CLI on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Install & Build Static Assets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure Fast SSH via Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat <<EOF > ~/.ssh/config
          Host vps-tunnel
            HostName ${{ secrets.REMOTE_HOST }}
            User ${{ secrets.REMOTE_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            AddressFamily inet6
            ConnectTimeout 10
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Compress, Transfer & Deploy
        run: |
          # 1. Archive dist files locally
          tar -czf dist.tar.gz -C dist .

          # 2. Upload single tarball over Tunnel
          scp dist.tar.gz vps-tunnel:/tmp/dist.tar.gz

          # 3. Extract to web root & restart PM2 using absolute path
          ssh vps-tunnel "tar -xzf /tmp/dist.tar.gz -C /var/www/test-app --overwrite && rm /tmp/dist.tar.gz && /home/charles/.npm-global/bin/pm2 restart test-app"

          # 4. Clean up local runner artifact
          rm dist.tar.gz